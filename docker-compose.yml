# Apache Kafka (KRaft, single node) + ScyllaDB for local dev and the clone-platform integration tests.
#
# The integration suite (tests/) binds host ports 9092 (Kafka API) and 9042 (CQL)
# statically. With KAFKA_JOURNAL_EXTERNAL_SERVICES=true the suite skips starting
# its own testcontainers and uses these services instead:
#
#   docker compose up -d --wait
#   KAFKA_JOURNAL_EXTERNAL_SERVICES=true sbt tests/test
#
# Same broker version as CI and the platform environments (Strimzi, Kafka 4.3.2; INFRA-205).
services:
  kafka:
    # KJ_KAFKA_IMAGE re-points at a mirror (e.g. a Harbor Docker-Hub proxy); the default
    # here is THE version pin for this stack. The healthcheck needs the JVM image's
    # /opt/kafka/bin tools, so a mirror must be of apache/kafka, not apache/kafka-native.
    # (IntegrationSuite reads KJ_KAFKA_IMAGE too, but only in testcontainers mode.)
    image: ${KJ_KAFKA_IMAGE:-apache/kafka:4.3.2}
    container_name: kafka-journal-kafka
    hostname: kafka
    environment:
      # one combined controller+broker node; every replication setting explicit,
      # because Kafka's defaults assume three brokers (transactions hang otherwise)
      CLUSTER_ID: kafka-journal-dev-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    ports:
      - "9092:9092" # host clients (sbt tests, kafka-journal defaults)
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  scylla:
    image: ${KJ_SCYLLA_IMAGE:-scylladb/scylla:2025.1}
    container_name: kafka-journal-scylla
    command: >-
      --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042" # CQL — kafka-journal's default contact point
      - "9180:9180" # native Prometheus metrics
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  kafka_data:
  scylla_data:
