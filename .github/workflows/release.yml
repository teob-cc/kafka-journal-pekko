name: Release

# A deliberate release of cc.teob kafka-journal: Maven Central, then the platform Nexus, then the lambda-house mirror,
# then the tag v<version> here. A master push only publishes a snapshot (snapshot.yml); teob and the other services
# depend on releases only, so a release is the one way a change reaches them.
#
# Refuses to release a commit whose E2E (clone platform) run did not pass, and a version that was already released.
# With dry_run it builds, signs and stages, and lists what would be published.
#
# Runs on GitHub-hosted runners: the repository is public, and the teob-cc self-hosted runners are not offered to
# public repositories.
#
# Secrets: SONATYPE_USER, SONATYPE_PASSWORD, GPG_SECRET, GPG_PASS (organisation-wide, shared with the cats-effect and
# blaze forks); NEXUS_USERNAME, NEXUS_PASSWORD in the `test` environment; LAMBDA_HOUSE_MIRROR_APP_KEY and the
# variable LAMBDA_HOUSE_MIRROR_APP_ID for the mirror.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: <yyyyMM>.<minor>.<n>, e.g. 202610.01.6'
        required: true
        type: string
      dry_run:
        description: 'Build, sign and stage only: no Central, no Nexus, no mirror, no tag'
        required: false
        default: false
        type: boolean
      base_domain:
        description: 'Base domain of the Nexus environment (nexus-api.<base_domain>)'
        required: true
        default: test.teob.cc
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  NEXUS_REGISTRY: nexus-api.${{ inputs.base_domain }}
  JAVA_TOOL_OPTIONS: "-Dcats.effect.tracing.mode=none -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+UseStringDeduplication"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment:
      name: test

    permissions:
      contents: write # pushes the release tag
      actions: read   # looks up the commit's E2E run

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{6}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "a release version is <yyyyMM>.<minor>.<n>, got '$VERSION'" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released" >&2; exit 1
          fi

      - name: Check that E2E passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.total_count')
          if [ "$RUNS" = "0" ]; then
            echo "E2E (clone platform) has not passed on ${{ github.sha }}; push it to master (or dispatch e2e.yml) and wait for green" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Import the signing key
        env:
          GPG_SECRET: ${{ secrets.GPG_SECRET }}
          GPG_PASS: ${{ secrets.GPG_PASS }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          printf "%s" "$GPG_SECRET" | gpg --batch --passphrase "$GPG_PASS" --import
          # sbt-pgp signs non-interactively, so drop the passphrase on this throwaway runner
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          (echo "$GPG_PASS"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase "$KEY"
          gpg --list-secret-keys

      - name: Unit tests
        run: sbt "Test/compile; testUnit"
        env:
          PACKAGE_VERSION: ${{ inputs.version }}

      - name: Sign and stage for Maven Central
        run: sbt publishSigned
        env:
          PUBLISH_TARGET: central
          PACKAGE_VERSION: ${{ inputs.version }}

      - name: List staged artifacts
        run: find target/sona-staging -name '*.pom' | sed 's|.*/||' | sort

      - name: Release to Maven Central
        if: ${{ !inputs.dry_run }}
        run: sbt sonaRelease
        env:
          PUBLISH_TARGET: central
          PACKAGE_VERSION: ${{ inputs.version }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Publish to Nexus
        if: ${{ !inputs.dry_run }}
        run: sbt publish
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # teob-cc/kafka-journal-pekko is the source of truth; lambda-house/kafka-journal-pekko is a read-only copy that
      # publishes each release to the lambda-house Nexus under the same version (its `mirror` branch does that).
      # Hand it the commit just released, tagged v<version>, with a token of the lambda-house GitHub App
      # teob-cc-mirror (Contents + Workflows write on that repository only; a deploy key cannot push workflow changes).
      - name: Token for lambda-house/kafka-journal-pekko
        if: ${{ !inputs.dry_run }}
        id: mirror-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LAMBDA_HOUSE_MIRROR_APP_ID }}
          private-key: ${{ secrets.LAMBDA_HOUSE_MIRROR_APP_KEY }}
          owner: lambda-house
          repositories: kafka-journal-pekko

      - name: Mirror the release to lambda-house
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ steps.mirror-app.outputs.token }}
        run: |
          set -euo pipefail
          # checkout stored this repository's token as a github.com header; it must not ride along to lambda-house
          git -c http.https://github.com/.extraheader= push --force \
            "https://x-access-token:${TOKEN}@github.com/lambda-house/kafka-journal-pekko.git" \
            HEAD:refs/heads/master "HEAD:refs/tags/v${VERSION}"

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Remove the signing key
        if: always()
        run: rm -rf ~/.gnupg

      - name: Summary
        run: |
          echo "### ${{ inputs.dry_run && 'Staged (dry run)' || 'Released to Maven Central and Nexus' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Central:** https://central.sonatype.com/artifact/cc.teob/kafka-journal-persistence_3/$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
