# Disambiguation lane (provisioning plan §9.2): IntegrationSuite via the original
# testcontainers path against upstream's own image pins. When clone-e2e fails and
# this is green, the failure is a clone quirk (patch the vendored client stack);
# when both are red, the bug is ours. Also keeps us honestly mergeable with
# upstream kafka-journal. Weekly — the JVM Cassandra makes this the heavier lane.
name: Upstream canary

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  upstream-canary:
    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run IntegrationSuite (testcontainers, upstream images)
        run: sbt tests/test
        env:
          # Upstream pins (the IntegrationSuite defaults), pulled from Docker Hub
          KJ_KAFKA_IMAGE: apache/kafka-native:3.8.1
          KJ_CASSANDRA_IMAGE: cassandra:4.1.8
          JAVA_TOOL_OPTIONS: "-Dcats.effect.tracing.mode=none -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+UseStringDeduplication"
