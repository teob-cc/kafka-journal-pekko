name: E2E (clone platform)

# Clone-e2e lane (infra provisioning plan §9 / repo CLAUDE.md next-steps):
# full IntegrationSuite in external-services mode against the same
# Apache Kafka 4.3.2 (KRaft, single node) + Scylla 2025.1 images as local dev and the platform environments.
# Runs on teob-cc's own runners for public repositories ([self-hosted, test-public]: the runner group
# "public", no cluster secrets, internet-only egress; infra-skills tools/k3s/public-runners.sh). Never on
# GitHub-hosted runners. A pull request from a fork waits for a maintainer's approval before it runs.

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  # this repo's normal flow is direct pushes to master (a push is a release) —
  # without this trigger the lane would almost never run
  push:
    branches: [ master ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Version pins live in docker-compose.yml; images come straight from Docker Hub.

jobs:
  e2e:
    runs-on: [self-hosted, test-public]

    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Start Kafka + Scylla (fresh volumes)
        # --wait blocks on the compose healthchecks (kafka-broker-api-versions.sh / cqlsh).
        # down -v first is belt-and-braces: the TCK needs a virgin journal and
        # ephemeral runners never carry volumes, but a local rerun must not
        # see stale data (see CLAUDE.md on JSON-decode fallback
        # failures from dirty state).
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --wait
          docker ps

      - name: Run IntegrationSuite (external services)
        run: sbt tests/test
        env:
          KAFKA_JOURNAL_EXTERNAL_SERVICES: "true"
          # .jvmopts (-Xmx4G) fits the runner pod (12 GiB; dockerd, with Kafka and Scylla, has its own 8 GiB)
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=85.0 -Dcats.effect.tracing.mode=none -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+UseStringDeduplication"

      - name: Service logs on failure
        if: failure()
        run: |
          echo "=== kafka ==="
          docker compose logs --tail=150 kafka || true
          echo "=== scylla ==="
          docker compose logs --tail=150 scylla || true

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Summary
        run: |
          echo "### Clone-platform E2E green ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "IntegrationSuite against Apache Kafka 4.3.2 + Scylla 2025.1 (external-services mode, fresh volumes)" >> $GITHUB_STEP_SUMMARY
