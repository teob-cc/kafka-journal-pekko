name: E2E (clone platform)

# Clone-e2e lane (infra provisioning plan §9 / repo CLAUDE.md next-steps):
# full IntegrationSuite in external-services mode against the same
# Redpanda v25.1.1 + Scylla 2025.1 images as local dev and the platform environments.
# Runs on GitHub-hosted runners: the repository is public, and the teob-cc self-hosted
# runners are not offered to public repositories (an outside pull request must never run there).

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  # this repo's normal flow is direct pushes to master (a push is a release) —
  # without this trigger the lane would almost never run
  push:
    branches: [ master ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Version pins live in docker-compose.yml; images come straight from Docker Hub.

jobs:
  e2e:
    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Start Redpanda + Scylla (fresh volumes)
        # --wait blocks on the compose healthchecks (rpk cluster health / cqlsh).
        # down -v first is belt-and-braces: the TCK needs a virgin journal and
        # ephemeral runners never carry volumes, but a local rerun must not
        # see stale data (see CLAUDE.md on JSON-decode fallback
        # failures from dirty state).
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --wait
          docker ps

      - name: Run IntegrationSuite (external services)
        run: sbt tests/test
        env:
          KAFKA_JOURNAL_EXTERNAL_SERVICES: "true"
          # .jvmopts (-Xmx4G) fits the hosted runner's 16 GB next to Redpanda and Scylla
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=85.0 -Dcats.effect.tracing.mode=none -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+UseStringDeduplication"

      - name: Service logs on failure
        if: failure()
        run: |
          echo "=== redpanda ==="
          docker compose logs --tail=150 redpanda || true
          echo "=== scylla ==="
          docker compose logs --tail=150 scylla || true

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Summary
        run: |
          echo "### Clone-platform E2E green ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "IntegrationSuite against Redpanda v25.1.1 + Scylla 2025.1 (external-services mode, fresh volumes)" >> $GITHUB_STEP_SUMMARY
