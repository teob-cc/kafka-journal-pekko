name: Publish to Nexus

on:
  # Gated on the clone-e2e lane: a master push runs E2E first, and only a green
  # run publishes. workflow_dispatch still publishes immediately (escape hatch).
  workflow_run:
    workflows: [ "E2E (clone platform)" ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty for auto-generated)'
        required: false
        type: string
      environment:
        description: 'Target environment (dev/cit/prod)'
        required: true
        default: cit
        type: string
      build_image_tag:
        description: 'Build image tag'
        required: false
        type: string
        default: 'latest'

env:
  HARBOR_REGISTRY: harbor.${{ inputs.environment || 'cit' }}.lh.jacum.com
  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  NEXUS_REGISTRY: nexus-api.${{ inputs.environment || 'cit' }}.lh.jacum.com
  # Repo secrets hold the Nexus 'deployment' user (source of truth:
  # k8s secret nexus/nexus-deployment-credentials in the cit cluster).
  # The org-level NEXUS_*_CIT secrets were verified stale on 2026-07-19.
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
jobs:
  publish:
    # Only a green E2E on a master *push* is a release; PR-triggered E2E runs
    # reach this workflow too and must not publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    runs-on:
      - self-hosted
      - ${{ inputs.environment || 'cit' }}

    environment:
      name: ${{ inputs.environment || 'cit' }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      - name: Ensure sbt is available on PATH
        run: |
          echo "Checking sbt installation locations..."
          if [ -x /usr/local/sbt/bin/sbt ]; then
            echo "/usr/local/sbt/bin" >> "$GITHUB_PATH"
            echo "Added /usr/local/sbt/bin to PATH"
          elif [ -x /usr/local/bin/sbt ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "Added /usr/local/bin to PATH"
          else
            echo "sbt not found at /usr/local/sbt/bin or /usr/local/bin" >&2
            echo "Diagnostics:"
            ls -la /usr/local/sbt/bin 2>&1 || echo "/usr/local/sbt/bin not found"
            ls -la /usr/local/bin 2>&1 || echo "/usr/local/bin not found"
            exit 1
          fi

      - name: Diagnostic - Runner Environment
        run: |
          echo "=== Runner Environment ==="
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "PWD: $PWD"
          echo "PATH: $PATH"
          echo ""
          echo "=== Available Tools ==="
          which java || echo "java not found"
          which scala || echo "scala not found"
          which sbt || echo "sbt not found"
          which docker || echo "docker not found"
          echo ""
          echo "=== Versions ==="
          java -version 2>&1 || true
          sbt --version 2>&1 || true
          echo ""
          echo "=== SBT Location Check ==="
          ls -la /usr/local/sbt/bin/ 2>&1 || echo "/usr/local/sbt/bin not found"
          ls -la /usr/local/bin/sbt 2>&1 || echo "/usr/local/bin/sbt not found"
          find /usr/local -name sbt -type f 2>/dev/null || echo "sbt not found in /usr/local"
          echo ""
          echo "=== Runner Image ==="
          cat /etc/os-release || true

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # workflow_run defaults to the default-branch HEAD, which may already have
          # moved past the commit E2E validated — publish exactly what went green.
          # Empty on workflow_dispatch, where checkout falls back to the default branch.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine version
        id: version
        # CalVer, computed in build.sbt: <base>.<run number> in CI, <base>-SNAPSHOT
        # locally, PACKAGE_VERSION overrides — this step only mirrors that for the summary
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(sbt --no-colors --error "print version" 2>/dev/null | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tail -n 1 | xargs)
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Run tests and publish
        # .jvmopts (-Xmx4G) must fit the runner pod's 6Gi cgroup limit
        run: sbt "Test/compile; testUnit; publish"
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.VERSION }}
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=85.0 -Dcats.effect.tracing.mode=none -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+UseStringDeduplication"

      - name: Summary
        run: |
          echo "### Published to Nexus 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** https://nexus-api.${{ inputs.environment || 'cit' }}.lh.jacum.com" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            echo "**Gated by E2E run:** [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Gated by E2E run:** none (manual dispatch)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
