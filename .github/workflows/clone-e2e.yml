# Primary integration lane (provisioning plan §9): IntegrationSuite against the
# SAME Redpanda + ScyllaDB images we run in compose, cit and prod. A green run is
# the standing compat proof for the clone platform and gates image-pin bumps.
#
# Runs the compose stack inside the DinD runner and the suite in external-services
# mode (KAFKA_JOURNAL_EXTERNAL_SERVICES=true, static localhost:9092/9042).
# Envelope: Redpanda + Scylla live under dockerd's 6Gi cgroup, sbt (4G) + forked
# test JVM (3G ceiling) under the runner's 6Gi — ≈4–5Gi actual peak per side.
name: Clone e2e

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: clone-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version pins live in docker-compose.yml; these only re-point the pulls at the
  # Harbor Docker-Hub proxy (public project, anonymous pull) to dodge Hub rate limits.
  KJ_REDPANDA_IMAGE: harbor.cit.lh.jacum.com/dockerhub-proxy/redpandadata/redpanda:v25.1.1
  KJ_SCYLLA_IMAGE: harbor.cit.lh.jacum.com/dockerhub-proxy/scylladb/scylla:2025.1

jobs:
  clone-e2e:
    runs-on:
      - self-hosted
      - cit

    timeout-minutes: 60

    steps:

      - name: Ensure sbt is available on PATH
        run: |
          if [ -x /usr/local/sbt/bin/sbt ]; then
            echo "/usr/local/sbt/bin" >> "$GITHUB_PATH"
          elif [ -x /usr/local/bin/sbt ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          else
            echo "sbt not found at /usr/local/sbt/bin or /usr/local/bin" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5

      # down -v first: the Pekko TCK uses fixed persistence ids and needs a virgin
      # journal — stale volumes surface as JSON-decode failures in the replay specs
      - name: Start Redpanda + ScyllaDB (fresh volumes)
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --wait

      - name: Run IntegrationSuite
        run: sbt tests/test
        env:
          KAFKA_JOURNAL_EXTERNAL_SERVICES: "true"
          JAVA_TOOL_OPTIONS: "-Dcats.effect.tracing.mode=none -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+UseStringDeduplication"

      - name: Dump service logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
