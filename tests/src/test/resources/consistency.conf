include "application.conf"

pekko {
  loglevel = "WARNING"
}

evolutiongaming.kafka-journal {

  persistence.journal {
    persistence-id-to-key.constant-topic.topic = "journal-consistency"

    # recovers after deleting half of the journal, without a snapshot: a short replay, which the
    # plugin refuses by default
    refuse-short-replay = false
    kafka {
      consumer {
        max-poll-records = 10
      }
    }

    cassandra {
      segment-size = 10
      client.query.fetch-size = 10
    }
  }

  replicator {
    cassandra {
      segment-size = 10
      client.query.fetch-size = 10
    }

    kafka {
      consumer {
        max-poll-records = 20
      }
    }
  }
}