include "application.conf"

pekko {
  loglevel = "WARNING"

  test {
    timefactor = 3.0
  }

  actor {
    serializers {
      pekko-persistence-tck = "com.evolution.kafka.journal.pekko.persistence.journal.PersistenceTckSerializer"
    }
    serialization-bindings {
      "org.apache.pekko.persistence.journal.JournalPerfSpec$Cmd" = pekko-persistence-tck
    }
  }
}

evolutiongaming.kafka-journal.persistence.journal {

  persistence-id-to-key.constant-topic.topic = "journal-perf"

  # Pekko's JournalSpec replays from seq 1 after a delete without a snapshot, and expects the
  # rest of the journal: a short replay. The plugin refuses it by default.
  refuse-short-replay = false
}