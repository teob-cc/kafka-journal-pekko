include "application.conf"

evolutiongaming.kafka-journal.persistence.journal {

  class = "com.evolution.kafka.journal.pekko.persistence.circe.KafkaJournalCirce"

  persistence-id-to-key.constant-topic.topic = "journal-integration-circe"

  # Pekko's JournalSpec replays from seq 1 after a delete without a snapshot, and expects the
  # rest of the journal: a short replay. The plugin refuses it by default.
  refuse-short-replay = false
}